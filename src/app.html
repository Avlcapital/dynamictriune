<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dynamic Triune | Renewable Energy Solutions in Africa</title>
    <meta name="title" content="Dynamic Triune | Renewable Energy Solutions in Africa">
    <meta name="description" content="Dynamic Triune is a leading renewable energy company delivering clean, sustainable power across East, Central, and Southern Africa.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dynamic Triune | Renewable Energy Solutions in Africa">
    <meta property="og:description" content="Dynamic Triune is a leading renewable energy company delivering clean, sustainable power across East, Central, and Southern Africa.">
    <meta property="og:image" content="%sveltekit.assets%/social-image.jpg">
    <link rel="preload" href="%sveltekit.assets%/logo.png" as="image">
    <meta name="theme-color" content="#151820">
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Dynamic Triune",
        "url": "https://www.dynamictriune.com",
        "logo": "https://www.dynamictriune.com/logo.png",
        "description": "A leading renewable energy company delivering clean, sustainable power across East, Central, and Southern Africa.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Lower Duplex Apartments, Suite 24, 2nd floor, Upperhill Road",
          "addressLocality": "Nairobi",
          "addressRegion": "Nairobi",
          "addressCountry": "Kenya"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+254 20 230 4180",
          "contactType": "customer service",
          "email": "info@dynamictriune.com"
        },
        "sameAs": [
          "https://www.linkedin.com/company/dynamic-triune",
          "https://twitter.com/dynamictriune"
        ]
      }
    </script>
  </body>
</html>
